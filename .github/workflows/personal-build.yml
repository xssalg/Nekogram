name: Personal APK - No ads + HTTP proxy
on:
  push:
    branches: [custom/noads-http]
  workflow_dispatch:
    inputs:
      existing_apk_run:
        description: 'Test QR login using an existing APK artifact; leave empty to build'
        type: string
        default: ''
      existing_apk_sha256:
        description: 'Expected SHA256 for the existing APK'
        type: string
        default: ''
      verify_login:
        description: 'Verify the new APK generates a real login QR using the temporary test proxy'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ inputs.existing_apk_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test HTTP CONNECT transport
        run: |
          python3 Tools/test_http_proxy.py
          python3 Tools/test_proxy_settings.py
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h .
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1'
      - name: Configure personal build
        env:
          KEYSTORE: ${{ secrets.NEKO_CUSTOM_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.NEKO_CUSTOM_KEYSTORE_PASSWORD }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib, subprocess, zlib, re
          api_id = os.environ.get('API_ID', '').strip()
          api_hash = os.environ.get('API_HASH', '').strip()
          if (not re.fullmatch(r'[1-9][0-9]*', api_id) or int(api_id) > 2147483647
                  or api_id == '4' or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash)
                  or api_hash.lower() == '014b35b6184100b085b0d0572f9b5103'):
              raise SystemExit('Configure your own API_ID and API_HASH repository secrets from my.telegram.org. Public sample credentials are not supported.')
          values = {
              'apiId': api_id,
              'apiHash': api_hash,
              'mapsApiKey': '', 'sentryDsn': '', 'helperBotUsername': '',
              'storeFile': str(pathlib.Path('personal.jks').resolve()),
              'storePassword': os.environ['KEYSTORE_PASSWORD'],
              'keyAlias': 'nekogram-personal',
              'keyPassword': os.environ['KEYSTORE_PASSWORD'],
          }
          pathlib.Path('personal.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE']))
          cert = subprocess.check_output(['keytool', '-exportcert', '-keystore', 'personal.jks',
              '-storepass:env', 'KEYSTORE_PASSWORD', '-alias', 'nekogram-personal'])
          pathlib.Path('personal-certificate.der').write_bytes(cert)
          values['nativeCertHash'] = '0x%08x' % zlib.crc32(cert)
          values['nativeCertSize'] = str(len(cert))
          pathlib.Path('local.properties').write_text(''.join(k+'='+v+'\n' for k,v in values.items()))
          props = pathlib.Path.home()/'.gradle/gradle.properties'
          props.parent.mkdir(exist_ok=True)
          with props.open('a') as f:
              f.write('\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\norg.gradle.parallel=false\nkotlin.daemon.jvmargs=-Xmx2g\n')
          PY
      - name: Build signed ARM64 APK
        run: ./gradlew :TMessagesProj_App:assembleRelease -PpersonalBuild=true -PcustomAbi=arm64-v8a -PAPP_PACKAGE=tw.nekomimi.nekogram.personal -PAPP_VERSION_NAME=12.10.6-noads-http-fix2 --stacktrace
      - name: Verify APK signature and checksum
        run: |
          for apk in TMessagesProj_App/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Nekogram-noads-http-arm64
          path: |
            TMessagesProj_App/build/outputs/apk/release/*.apk
            TMessagesProj_App/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Test native startup signature check
        run: |
          for apk in TMessagesProj_App/build/outputs/apk/release/*.apk; do
            python3 Tools/test_apk_signature.py "$apk" --certificate personal-certificate.der
          done
      - name: Remove signing material
        if: always()
        run: rm -f personal.jks local.properties personal-certificate.der

  startup-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nekogram-noads-http-arm64
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch personal APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash Tools/smoke_startup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-smoke
          path: startup-smoke
          if-no-files-found: warn

  qr-login-check:
    needs: build
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.existing_apk_run != '' || (inputs.verify_login && needs.build.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nekogram-noads-http-arm64
          path: artifacts
          run-id: ${{ inputs.existing_apk_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install QR decoder
        run: |
          python3 -m venv .qr-check-venv
          .qr-check-venv/bin/pip install pillow zxing-cpp
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual QR login screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NEKO_QR_CHECK_PROXY: ${{ secrets.NEKO_QR_CHECK_PROXY }}
          EXPECTED_APK_SHA256: ${{ inputs.existing_apk_sha256 }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: .qr-check-venv/bin/python Tools/smoke_qr_login.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-login-check
          path: qr-login-check
          if-no-files-found: warn
          retention-days: 7
